<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KIDMAN ROOM VR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      .ui-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 999;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 12px 14px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        max-width: 280px;
      }
      .ui-panel strong { color: #7CFC00; }
    </style>
  </head>
  <body>
    <div class="ui-panel">
      <strong>KIDMAN ROOM VR</strong><br>
      WASD / Arrow keys = move<br>
      Mouse / drag = look<br>
      VR button = enter headset mode<br>
      <br>
      <em>Tekan tombol VR di pojok kanan bawah jika tersedia.</em>
    </div>

    <a-scene background="color: #111" renderer="antialias: true; colorManagement: true;" vr-mode-ui="enabled: true">
      <a-assets>
        <a-asset-item id="room-model" src="kidman_room.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#room-model" position="0 0 0" rotation="0 180 0" scale="0.8 0.8 0.8"></a-entity>

      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.7; position: 1 3 2"></a-entity>
      <a-entity light="type: directional; intensity: 0.4; position: -1 2 -1"></a-entity>

      <a-entity id="cameraRig" position="0 1.6 3">
        <a-entity camera look-controls wasd-controls="acceleration: 40" position="0 0 0"></a-entity>
      </a-entity>

      <a-plane rotation="-90 0 0" width="50" height="50" color="#222" material="opacity: 0.6"></a-plane>
    </a-scene>
  </body>
</html>
